<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!-- Canvas Background -->
  <rect width="1000" height="1000" fill="#FFFFFF"/>
  
  <!-- Outer Circle Frame -->
  <circle cx="500" cy="500" r="390" fill="none" stroke="#3D4B55" stroke-width="26"/>

  <!-- Logo Mark Graphic -->
  <g transform="translate(500, 395) scale(1.35)">
    <!-- Outer House Framing -->
    <path d="M -90,90 L -90,-10 L 0,-85 L 90,-10 L 90,90 L 58,90 M -58,90 L -90,90" 
          fill="none" stroke="#3D4B55" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter"/>
    
    <!-- Stilted Inner Arch -->
    <path d="M -54,90 L -54,-20 A 54,54 0 0,1 54,-10 L 54,90" 
          fill="none" stroke="#3D4B55" stroke-width="16" stroke-linecap="square"/>

    <!-- Upward Trendline Pulse -->
    <path d="M -125,70 L -25,25 L 12,72 L 125,-60" 
          fill="none" stroke="#3D4B55" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Arrowhead -->
    <path d="M 104,-72 L 140,-72 L 130,-36 Z" fill="#3D4B55"/>
  </g>

  <!-- Typography Block -->
  <g fill="#3D4B55" text-anchor="middle" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif">
    <text x="500" y="625" font-weight="800" font-size="62" letter-spacing="3">HOME ENERGY</text>
    <text x="500" y="700" font-weight="800" font-size="62" letter-spacing="3">ARCHITECT</text>
    <text x="500" y="755" font-weight="600" font-size="25" letter-spacing="6.5">INDEPENDENT CONSULTING</text>
  </g>
</svg>
