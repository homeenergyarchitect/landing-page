<svg class="w-6 h-6 text-emerald-600" aria-hidden="true" fill="none" stroke="currentColor" viewBox="-140 -100 280 220" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer House Framing -->
    <path d="M -90,90 L -90,-10 L 0,-85 L 90,-10 L 90,90 L 58,90 M -58,90 L -90,90" 
          stroke="currentColor" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter"/>
    
    <!-- Stilted Inner Arch -->
    <path d="M -54,90 L -54,20 A 54,54 0 0,1 54,20 L 54,90" 
          stroke="currentColor" stroke-width="16" stroke-linecap="square"/>

    <!-- Upward Trendline Pulse -->
    <path d="M -125,70 L -25,25 L 12,72 L 125,-60" 
          stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Arrowhead -->
    <path d="M 104,-72 L 140,-72 L 130,-36 Z" fill="currentColor" stroke="none"/>
</svg>
